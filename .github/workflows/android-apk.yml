name: Build HEX-STUDIO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ranger les fichiers dans la structure Android standard
        run: |
          S=_stage
          mkdir -p $S/app/src/main/java/com/centralhex/hexstudio $S/app/src/main/assets
          cp settings.gradle.kts gradle.properties $S/
          cp build.gradle.kts $S/app/build.gradle.kts
          cp AndroidManifest.xml $S/app/src/main/
          cp MainActivity.kt $S/app/src/main/java/com/centralhex/hexstudio/
          cp index.html style.css script.js $S/app/src/main/assets/

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compiler l'APK
        run: gradle -p _stage assembleDebug --stacktrace

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: HEX-STUDIO-debug-APK
          path: _stage/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
